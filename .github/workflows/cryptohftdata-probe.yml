name: CryptoHFTData bounded probe

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out probe branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install inspection dependencies
        run: python -m pip install --disable-pip-version-check duckdb pyarrow zstandard

      - name: Download recent hourly objects
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe/raw probe/vendor probe/http probe/analysis

          download_one() {
            local remote_path="$1"
            local output_name="$2"
            local url="https://api.cryptohftdata.com/download?file=${remote_path}"
            local header_file="probe/http/${output_name}.headers.txt"
            local payload_file="probe/vendor/${output_name}.payload"
            local analyzer_file="probe/raw/${output_name}.parquet.zst"

            echo "Downloading ${remote_path}"
            curl \
              --fail-with-body \
              --location \
              --silent \
              --show-error \
              --retry 4 \
              --retry-all-errors \
              --retry-delay 3 \
              --connect-timeout 30 \
              --max-time 900 \
              --dump-header "${header_file}" \
              --output "${payload_file}" \
              "${url}"

            test -s "${payload_file}"
            local magic
            magic="$(head -c 4 "${payload_file}" | od -An -tx1 | tr -d ' \n')"
            printf '%s\t%s\t%s bytes\n' "${output_name}" "${magic}" "$(stat -c %s "${payload_file}")" \
              | tee -a probe/analysis/vendor_payloads.txt
            sha256sum "${payload_file}" | tee -a probe/analysis/vendor_sha256.txt

            case "${magic}" in
              28b52ffd)
                cp "${payload_file}" "${analyzer_file}"
                ;;
              50415231)
                # Newer objects keep the historical .parquet.zst path suffix but are
                # already ordinary Parquet. Re-wrap only for the existing analyzer;
                # the exact vendor bytes remain untouched under probe/vendor/.
                zstd -q -3 -f "${payload_file}" -o "${analyzer_file}"
                ;;
              *)
                echo "Unexpected payload magic ${magic}" >&2
                head -c 500 "${payload_file}" >&2 || true
                exit 1
                ;;
            esac
          }

          download_one \
            "bybit/2026-08-20/20/BTCUSDT_orderbook.parquet.zst" \
            "bybit_2026-08-20_20_BTCUSDT_orderbook"

          download_one \
            "binance_futures/2026-08-20/20/BTCUSDT_orderbook.parquet.zst" \
            "binance_futures_2026-08-20_20_BTCUSDT_orderbook"

          sha256sum probe/raw/*.zst > probe/analysis/analyzer_sha256.txt
          ls -lh probe/raw probe/vendor | tee probe/analysis/file_sizes.txt

      - name: Inspect Parquet schemas, messages, snapshots, and cadence
        run: |
          python scripts/cryptohftdata_probe.py \
            --raw-dir probe/raw \
            --out-dir probe/analysis

      - name: Deep-analyze Bybit stream families and Binance continuity
        run: |
          python scripts/cryptohftdata_deep_probe.py \
            --raw-dir probe/raw \
            --out-dir probe/analysis

      - name: Print concise result
        if: always()
        run: |
          for report in probe/analysis/summary.md probe/analysis/deep_summary.md; do
            if [[ -f "${report}" ]]; then
              cat "${report}"
            fi
          done
          for hashes in probe/analysis/vendor_sha256.txt probe/analysis/analyzer_sha256.txt; do
            if [[ -f "${hashes}" ]]; then
              cat "${hashes}"
            fi
          done

      - name: Upload original objects and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cryptohftdata-probe-2026-08-20-20
          path: probe/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
